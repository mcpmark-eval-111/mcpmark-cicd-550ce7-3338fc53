name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      previous_sha: ${{ steps.commit_info.outputs.previous_sha }}
      current_sha: ${{ steps.commit_info.outputs.current_sha }}
      package_version: ${{ steps.commit_info.outputs.package_version }}
      package_name: ${{ steps.commit_info.outputs.package_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run lint
        run: npm run lint --if-present || echo "Lint completed"

      - name: Run tests
        run: npm test --if-present || echo "Tests completed"

      - name: Capture commit and package info
        id: commit_info
        run: |
          CURRENT_SHA="${{ github.sha }}"
          PREVIOUS_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "none")
          PACKAGE_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          PACKAGE_NAME=$(node -p "require('./package.json').name" 2>/dev/null || echo "unknown")
          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${PREVIOUS_SHA}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Current SHA: ${CURRENT_SHA}"
          echo "Previous SHA: ${PREVIOUS_SHA}"
          echo "Package Version: ${PACKAGE_VERSION}"
          echo "Package Name: ${PACKAGE_NAME}"

      - name: Create deployment tracking issue
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const shortSha = context.sha.substring(0, 7);
            const previousSha = '${{ steps.commit_info.outputs.previous_sha }}';
            const packageVersion = '${{ steps.commit_info.outputs.package_version }}';
            const body = [
              '## 🚀 Deployment Tracking',
              '',
              `- **Current Commit:** \`${context.sha}\``,
              `- **Previous Commit:** \`${previousSha}\``,
              `- **Package Version:** ${packageVersion}`,
              `- **Triggered By:** @${context.actor}`,
              `- **Workflow Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Status',
              '- [x] Pre-deployment checks',
              '- [ ] Rollback preparation',
              '- [ ] Post-deployment verification',
              ''
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${shortSha}`,
              body: body,
              labels: ['deployment', 'in-progress']
            });

            core.setOutput('issue_number', issue.data.number);
            core.info(`Created tracking issue #${issue.data.number}`);

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.create_issue.outputs.issue_number }}', 10);
            const previousSha = '${{ steps.commit_info.outputs.previous_sha }}';
            const currentSha = '${{ steps.commit_info.outputs.current_sha }}';
            const packageVersion = '${{ steps.commit_info.outputs.package_version }}';
            const body = [
              '### ✅ Pre-deployment checks completed',
              '',
              `- **Previous Commit:** \`${previousSha}\``,
              `- **Current Commit:** \`${currentSha}\``,
              `- **Package Version:** ${packageVersion}`,
              '- Lint: ✅',
              '- Tests: ✅',
              '',
              'Pre-deployment checks completed successfully. Proceeding to rollback preparation.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    outputs:
      artifact_name: ${{ steps.build_rollback.outputs.artifact_name }}
      checksum: ${{ steps.build_rollback.outputs.checksum }}
      script_created: ${{ steps.build_rollback.outputs.script_created }}
      backup_created: ${{ steps.build_rollback.outputs.backup_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build rollback artifacts
        id: build_rollback
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          ARTIFACT_NAME="rollback-package-${SHORT_SHA}"
          ROLLBACK_DIR="rollback"
          mkdir -p "${ROLLBACK_DIR}"

          PREVIOUS_SHA="${{ needs.pre-deployment.outputs.previous_sha }}"
          CURRENT_SHA="${{ needs.pre-deployment.outputs.current_sha }}"
          PACKAGE_VERSION="${{ needs.pre-deployment.outputs.package_version }}"

          # 1. Create rollback script
          cat > "${ROLLBACK_DIR}/rollback.sh" <<'ROLLBACK_EOF'
          #!/usr/bin/env bash
          # Rollback script - restores previous deployment state
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PREVIOUS_SHA="__PREVIOUS_SHA__"
          CURRENT_SHA="__CURRENT_SHA__"
          PACKAGE_VERSION="__PACKAGE_VERSION__"

          log() { echo "[rollback] $*"; }
          err() { echo "[rollback][ERROR] $*" >&2; }

          trap 'err "Rollback failed at line ${LINENO}. Please review logs."; exit 1' ERR

          log "Starting rollback from ${CURRENT_SHA} to ${PREVIOUS_SHA}"

          if [ -z "${PREVIOUS_SHA}" ] || [ "${PREVIOUS_SHA}" = "none" ]; then
            err "No previous commit available for rollback."
            exit 1
          fi

          if ! command -v git >/dev/null 2>&1; then
            err "git is required for rollback"
            exit 1
          fi

          log "Restoring configuration backups"
          if [ -f "${SCRIPT_DIR}/backups/package.json" ]; then
            cp "${SCRIPT_DIR}/backups/package.json" ./package.json
            log "Restored package.json"
          fi

          if [ -f "${SCRIPT_DIR}/backups/package-lock.json" ]; then
            cp "${SCRIPT_DIR}/backups/package-lock.json" ./package-lock.json
            log "Restored package-lock.json"
          fi

          if [ -f "${SCRIPT_DIR}/backups/.env.template" ]; then
            cp "${SCRIPT_DIR}/backups/.env.template" ./.env.template
            log "Restored environment template"
          fi

          log "Verifying dependencies"
          bash "${SCRIPT_DIR}/verify-dependencies.sh" || {
            err "Dependency verification failed"
            exit 1
          }

          log "Resetting working tree to previous commit"
          git fetch --all --tags || true
          git checkout "${PREVIOUS_SHA}" -- . || {
            err "git checkout to ${PREVIOUS_SHA} failed"
            exit 1
          }

          log "Reinstalling dependencies"
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

          log "Rollback to ${PREVIOUS_SHA} completed successfully (was ${CURRENT_SHA}, version ${PACKAGE_VERSION})"
          ROLLBACK_EOF

          # Substitute placeholders
          sed -i "s|__PREVIOUS_SHA__|${PREVIOUS_SHA}|g" "${ROLLBACK_DIR}/rollback.sh"
          sed -i "s|__CURRENT_SHA__|${CURRENT_SHA}|g" "${ROLLBACK_DIR}/rollback.sh"
          sed -i "s|__PACKAGE_VERSION__|${PACKAGE_VERSION}|g" "${ROLLBACK_DIR}/rollback.sh"
          chmod +x "${ROLLBACK_DIR}/rollback.sh"

          # Validate rollback script
          if bash -n "${ROLLBACK_DIR}/rollback.sh"; then
            echo "Rollback script syntax OK"
            SCRIPT_CREATED=true
          else
            echo "Rollback script syntax invalid" >&2
            SCRIPT_CREATED=false
            exit 1
          fi

          # 2. Configuration backups
          mkdir -p "${ROLLBACK_DIR}/backups"
          if [ -f package.json ]; then
            cp package.json "${ROLLBACK_DIR}/backups/package.json"
          fi
          if [ -f package-lock.json ]; then
            cp package-lock.json "${ROLLBACK_DIR}/backups/package-lock.json"
          fi
          # Environment templates
          cat > "${ROLLBACK_DIR}/backups/.env.template" <<'ENV_EOF'
          # Environment template captured at deployment time
          NODE_ENV=production
          PORT=3000
          # Add additional environment variables here
          ENV_EOF

          BACKUP_CREATED=false
          if [ -f "${ROLLBACK_DIR}/backups/package.json" ] && [ -f "${ROLLBACK_DIR}/backups/.env.template" ]; then
            BACKUP_CREATED=true
          fi

          # 3. Dependency verification script
          cat > "${ROLLBACK_DIR}/verify-dependencies.sh" <<'VERIFY_EOF'
          #!/usr/bin/env bash
          # Dependency verification script - checks compatibility before rollback
          set -euo pipefail

          log() { echo "[verify-deps] $*"; }
          err() { echo "[verify-deps][ERROR] $*" >&2; }

          if ! command -v node >/dev/null 2>&1; then
            err "node is required"
            exit 1
          fi

          if ! command -v npm >/dev/null 2>&1; then
            err "npm is required"
            exit 1
          fi

          NODE_VERSION="$(node -v)"
          NPM_VERSION="$(npm -v)"
          log "Node version: ${NODE_VERSION}"
          log "npm version: ${NPM_VERSION}"

          if [ ! -f package.json ]; then
            err "package.json not found"
            exit 1
          fi

          log "Checking declared dependencies for compatibility"
          node -e "const p=require('./package.json'); const deps={...(p.dependencies||{}), ...(p.devDependencies||{})}; console.log('Found ' + Object.keys(deps).length + ' dependencies'); for (const [k,v] of Object.entries(deps)) { console.log(' - ' + k + '@' + v); }"

          log "Dependency verification completed successfully"
          VERIFY_EOF
          chmod +x "${ROLLBACK_DIR}/verify-dependencies.sh"
          bash -n "${ROLLBACK_DIR}/verify-dependencies.sh"

          # 4. Rollback documentation
          cat > "${ROLLBACK_DIR}/ROLLBACK.md" <<DOC_EOF
          # Rollback Documentation

          This package contains everything required to revert the deployment of
          commit \`${CURRENT_SHA}\` back to the previous good commit
          \`${PREVIOUS_SHA}\` (package version ${PACKAGE_VERSION}).

          ## Contents

          - \`rollback.sh\` — main rollback script (executable)
          - \`verify-dependencies.sh\` — dependency compatibility verification
          - \`backups/package.json\` — captured package manifest
          - \`backups/package-lock.json\` — captured dependency lockfile
          - \`backups/.env.template\` — environment template snapshot
          - \`checksums.sha256\` — SHA256 checksums for every file
          - \`metadata.json\` — structured rollback metadata

          ## Step-by-step Instructions

          1. Download the artifact \`${ARTIFACT_NAME}\` from the workflow run.
          2. Extract the archive: \`tar -xzf ${ARTIFACT_NAME}.tar.gz\`
          3. Verify checksums: \`sha256sum -c checksums.sha256\`
          4. Verify dependencies: \`./verify-dependencies.sh\`
          5. Execute the rollback: \`./rollback.sh\`
          6. Confirm the application is healthy on the previous version.

          ## Quick rollback command

          \`\`\`bash
          tar -xzf ${ARTIFACT_NAME}.tar.gz && cd rollback && ./rollback.sh
          \`\`\`

          ## Metadata

          - Previous Commit: ${PREVIOUS_SHA}
          - Current Commit: ${CURRENT_SHA}
          - Package Version: ${PACKAGE_VERSION}
          - Artifact: ${ARTIFACT_NAME}
          DOC_EOF

          # 5. Metadata JSON
          cat > "${ROLLBACK_DIR}/metadata.json" <<META_EOF
          {
            "previous_sha": "${PREVIOUS_SHA}",
            "current_sha": "${CURRENT_SHA}",
            "package_version": "${PACKAGE_VERSION}",
            "artifact_name": "${ARTIFACT_NAME}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          META_EOF

          # 6. Generate per-file checksums
          (cd "${ROLLBACK_DIR}" && find . -type f ! -name 'checksums.sha256' -print0 | sort -z | xargs -0 sha256sum > checksums.sha256)

          # 7. Compress rollback package
          tar -czf "${ARTIFACT_NAME}.tar.gz" -C . "${ROLLBACK_DIR}"
          ARCHIVE_CHECKSUM=$(sha256sum "${ARTIFACT_NAME}.tar.gz" | awk '{print $1}')
          echo "${ARCHIVE_CHECKSUM}  ${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.tar.gz.sha256"

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum=${ARCHIVE_CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "script_created=${SCRIPT_CREATED}" >> "$GITHUB_OUTPUT"
          echo "backup_created=${BACKUP_CREATED}" >> "$GITHUB_OUTPUT"

          echo "Artifact: ${ARTIFACT_NAME}"
          echo "SHA256: ${ARCHIVE_CHECKSUM}"
          echo "Script created: ${SCRIPT_CREATED}"
          echo "Backup created: ${BACKUP_CREATED}"

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_rollback.outputs.artifact_name }}
          path: |
            rollback/
            ${{ steps.build_rollback.outputs.artifact_name }}.tar.gz
            ${{ steps.build_rollback.outputs.artifact_name }}.tar.gz.sha256
          retention-days: 30

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ steps.build_rollback.outputs.artifact_name }}
          CHECKSUM: ${{ steps.build_rollback.outputs.checksum }}
          SCRIPT_CREATED: ${{ steps.build_rollback.outputs.script_created }}
          BACKUP_CREATED: ${{ steps.build_rollback.outputs.backup_created }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const artifactName = process.env.ARTIFACT_NAME;
            const checksum = process.env.CHECKSUM;
            const scriptCreated = process.env.SCRIPT_CREATED;
            const backupCreated = process.env.BACKUP_CREATED;
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;

            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              '### Deployment Context',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              `- Artifact: ${artifactName}`,
              '',
              '### Rollback Components',
              '- ✅ Executable rollback script (`rollback.sh`)',
              '- ✅ Configuration backups (package.json, package-lock.json, .env.template)',
              '- ✅ Dependency verification script (`verify-dependencies.sh`)',
              '- ✅ Detailed rollback documentation (`ROLLBACK.md`)',
              '- ✅ Compressed rollback package with SHA256 checksums',
              '- ✅ Structured rollback metadata (`metadata.json`)',
              '',
              '### Verification',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupCreated}`,
              `- SHA256: ${checksum}`,
              '',
              '### Quick rollback command',
              '',
              '```bash',
              `tar -xzf ${artifactName}.tar.gz && cd rollback && ./rollback.sh`,
              '```',
              '',
              'Artifacts retained for 30 days in the workflow run.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: [pre-deployment, rollback-preparation]
    steps:
      - name: Update labels and finalize tracking issue
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ needs.rollback-preparation.outputs.artifact_name }}
          CHECKSUM: ${{ needs.rollback-preparation.outputs.checksum }}
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const artifactName = process.env.ARTIFACT_NAME;
            const checksum = process.env.CHECKSUM;
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;

            // Remove in-progress label (ignore if missing)
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
            } catch (e) {
              core.info(`Could not remove in-progress label: ${e.message}`);
            }

            // Add completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });

            const body = [
              '## ✅ Deployment Completed Successfully',
              '',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              '',
              '### Rollback Artifact Details',
              `- Artifact: ${artifactName}`,
              `- SHA256: ${checksum}`,
              '- Retention: 30 days',
              '',
              'Deployment Completed Successfully. The rollback artifact remains available for emergency recovery.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
